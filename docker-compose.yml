version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: game2048-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game2048_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - game2048-network

  redis:
    image: redis:7-alpine
    container_name: game2048-redis
    ports:
      - "6379:6379"
    networks:
      - game2048-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game2048-backend
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/game2048_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - game2048-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game2048-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - game2048-network

volumes:
  mysql-data:

networks:
  game2048-network:
    driver: bridge
